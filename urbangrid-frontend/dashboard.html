<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · UrbanGrid</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="app-shell-mount"></div>

<div id="page-body" class="d-none">

  <div class="split-flap-header">
    <div>
      <h2 class="mb-1">Network overview</h2>
      <p class="text-secondary mb-0">Live counts across routes, schedules, vehicles and alerts.</p>
    </div>
    <span class="updated-at" id="updated-at"></span>
  </div>

  <!-- Stat cards -->
  <div class="dash-grid" id="stat-cards">
    <div class="stat-card"><div class="stat-label">Total Routes</div><div class="stat-value" id="stat-routes">—</div><i class="bi bi-signpost-split stat-icon"></i></div>
    <div class="stat-card"><div class="stat-label">Total Schedules</div><div class="stat-value" id="stat-schedules">—</div><i class="bi bi-calendar3 stat-icon"></i></div>
    <div class="stat-card"><div class="stat-label">Total Vehicles</div><div class="stat-value" id="stat-transports">—</div><i class="bi bi-bus-front stat-icon"></i></div>
    <div class="stat-card"><div class="stat-label">Total Alerts</div><div class="stat-value" id="stat-alerts">—</div><i class="bi bi-bell stat-icon"></i></div>
    <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="stat-users">—</div><i class="bi bi-people stat-icon"></i></div>
  </div>

  <!-- Quick actions -->
  <div class="panel mb-4">
    <div class="panel-header"><h5>Quick actions</h5></div>
    <div class="quick-actions" id="quick-actions"><!-- injected by dashboard.js based on role --></div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-7">
      <div class="panel h-100">
        <div class="panel-header"><h5>Schedule volume</h5></div>
        <div class="chart-wrap"><canvas id="volume-chart"></canvas></div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="panel h-100">
        <div class="panel-header"><h5>Fleet mix by type</h5></div>
        <div class="chart-wrap"><canvas id="share-chart"></canvas></div>
      </div>
    </div>
  </div>

  <!-- Recent activity -->
  <div class="panel">
    <div class="panel-header">
      <h5>Recent alerts</h5>
      <a href="alerts.html" class="small" style="color:var(--teal-500);font-weight:600;">View all <i class="bi bi-arrow-right"></i></a>
    </div>
    <div id="recent-activity-wrap">
      <div class="text-center text-secondary py-4">
        <div class="spinner-border spinner-border-sm me-2"></div>Loading activity…
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  window.UG_ACTIVE_PAGE = "dashboard";
  window.UG_PAGE_TITLE = "Dashboard";
</script>
<script src="js/dashboard.js"></script>
</body>
</html>
