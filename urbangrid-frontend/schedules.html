<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules · UrbanGrid</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="app-shell-mount"></div>

<div id="page-body" class="d-none">

  <div class="panel mb-4">
    <div class="panel-header">
      <h5><i class="bi bi-funnel me-2"></i>Filter by status</h5>
      <button class="btn btn-teal d-none" id="add-schedule-btn"><i class="bi bi-plus-lg me-1"></i>Add Schedule</button>
    </div>
    <div class="btn-group" role="group" id="status-filter">
      <button type="button" class="btn btn-outline-navy active" data-status="ALL">All</button>
      <button type="button" class="btn btn-outline-navy" data-status="ON_TIME">On time</button>
      <button type="button" class="btn btn-outline-navy" data-status="DELAYED">Delayed</button>
      <button type="button" class="btn btn-outline-navy" data-status="CANCELLED">Cancelled</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h5><i class="bi bi-calendar3 me-2"></i>All schedules</h5></div>
    <div id="schedules-table-wrap">
      <div class="text-center text-secondary py-5"><div class="spinner-border spinner-border-sm me-2"></div>Loading schedules…</div>
    </div>
  </div>

</div>

<!-- Add/Edit modal -->
<div class="modal fade" id="schedule-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="schedule-modal-title">Add Schedule</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="schedule-form" novalidate>
        <div class="modal-body">
          <input type="hidden" id="schedule-id">

          <div class="mb-3">
            <label class="form-label" for="schedule-route">Route</label>
            <select class="form-select" id="schedule-route" required>
              <option value="">Select a route…</option>
            </select>
            <div class="invalid-feedback">Choose a route.</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="schedule-transport">Vehicle</label>
            <select class="form-select" id="schedule-transport" required>
              <option value="">Select a vehicle…</option>
            </select>
            <div class="invalid-feedback">Choose a vehicle.</div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label" for="schedule-departure">Departure</label>
              <input type="datetime-local" class="form-control" id="schedule-departure" required>
              <div class="invalid-feedback">Required.</div>
            </div>
            <div class="col-6">
              <label class="form-label" for="schedule-arrival">Arrival</label>
              <input type="datetime-local" class="form-control" id="schedule-arrival" required>
              <div class="invalid-feedback">Required.</div>
            </div>
          </div>

          <div class="mb-1">
            <label class="form-label" for="schedule-status">Status</label>
            <select class="form-select" id="schedule-status">
              <option value="ON_TIME">On time</option>
              <option value="DELAYED">Delayed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-teal" id="schedule-save-btn">Save schedule</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  window.UG_ACTIVE_PAGE = "schedules";
  window.UG_PAGE_TITLE = "Schedules";
</script>
<script src="js/schedules.js"></script>
</body>
</html>
