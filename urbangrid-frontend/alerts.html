<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerts · UrbanGrid</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="app-shell-mount"></div>

<div id="page-body" class="d-none">

  <div class="alert d-flex align-items-start gap-2" style="background:#fff8ec;border:1px solid #f5e2b8;color:#8a6416;">
    <i class="bi bi-info-circle-fill mt-1"></i>
    <div class="small">This is the backend's single alert feed — delay, cancellation, and maintenance notices all live here (<span class="mono">alertType</span>). There's no separate maintenance-records endpoint, and no edit/delete for alerts.</div>
  </div>

  <div class="panel mb-4">
    <div class="panel-header">
      <h5><i class="bi bi-funnel me-2"></i>Filter by type</h5>
      <button class="btn btn-teal" id="add-alert-btn"><i class="bi bi-plus-lg me-1"></i>Post Alert</button>
    </div>
    <div class="btn-group" role="group" id="type-filter">
      <button type="button" class="btn btn-outline-navy active" data-type="ALL">All</button>
      <button type="button" class="btn btn-outline-navy" data-type="DELAY">Delay</button>
      <button type="button" class="btn btn-outline-navy" data-type="CANCELLATION">Cancellation</button>
      <button type="button" class="btn btn-outline-navy" data-type="MAINTENANCE">Maintenance</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h5><i class="bi bi-bell me-2"></i>Alert feed</h5></div>
    <div id="alerts-table-wrap">
      <div class="text-center text-secondary py-5"><div class="spinner-border spinner-border-sm me-2"></div>Loading alerts…</div>
    </div>
  </div>

</div>

<!-- Add modal -->
<div class="modal fade" id="alert-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Post Alert</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="alert-form" novalidate>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="alert-type">Type</label>
            <select class="form-select" id="alert-type" required>
              <option value="DELAY">Delay</option>
              <option value="CANCELLATION">Cancellation</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="alert-schedule">Related schedule (optional)</label>
            <select class="form-select" id="alert-schedule">
              <option value="">Not linked to a specific schedule</option>
            </select>
          </div>
          <div class="mb-1">
            <label class="form-label" for="alert-message">Message</label>
            <textarea class="form-control" id="alert-message" rows="3" placeholder="e.g. Vehicle BUS-1042 held for brake inspection." required></textarea>
            <div class="invalid-feedback">Enter a message.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-teal" id="alert-save-btn">Post alert</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  window.UG_ACTIVE_PAGE = "alerts";
  window.UG_PAGE_TITLE = "Alerts";
</script>
<script src="js/alerts.js"></script>
</body>
</html>
