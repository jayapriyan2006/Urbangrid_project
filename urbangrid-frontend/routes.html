<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routes · UrbanGrid</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="app-shell-mount"></div>

<div id="page-body" class="d-none">

  <!-- Search / filter bar -->
  <div class="panel mb-4">
    <div class="panel-header">
      <h5><i class="bi bi-search me-2"></i>Search routes</h5>
      <button class="btn btn-teal d-none" id="add-route-btn"><i class="bi bi-plus-lg me-1"></i>Add Route</button>
    </div>
    <form id="search-form" class="row g-2 filter-bar" novalidate>
      <div class="col-sm-5">
        <input type="text" class="form-control" id="search-source" placeholder="Source (e.g. Central Station)" required>
      </div>
      <div class="col-sm-5">
        <input type="text" class="form-control" id="search-destination" placeholder="Destination (e.g. Airport)" required>
      </div>
      <div class="col-sm-2 d-grid">
        <button type="submit" class="btn btn-outline-navy"><i class="bi bi-search"></i> Search</button>
      </div>
    </form>
    <button class="btn btn-link p-0 mt-2 small d-none" id="clear-search-btn">
      <i class="bi bi-x-circle me-1"></i>Clear search, show all routes
    </button>
  </div>

  <!-- Routes table -->
  <div class="panel">
    <div class="panel-header">
      <h5 id="table-title"><i class="bi bi-signpost-split me-2"></i>All routes</h5>
    </div>
    <div id="routes-table-wrap">
      <div class="text-center text-secondary py-5"><div class="spinner-border spinner-border-sm me-2"></div>Loading routes…</div>
    </div>
  </div>

</div>

<!-- Add/Edit modal -->
<div class="modal fade" id="route-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="route-modal-title">Add Route</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="route-form" novalidate>
        <div class="modal-body">
          <input type="hidden" id="route-id">
          <div class="mb-3">
            <label class="form-label" for="route-name">Route name</label>
            <input type="text" class="form-control" id="route-name" required>
            <div class="invalid-feedback">Route name is required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="route-source">Source</label>
            <input type="text" class="form-control" id="route-source" required>
            <div class="invalid-feedback">Source is required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="route-destination">Destination</label>
            <input type="text" class="form-control" id="route-destination" required>
            <div class="invalid-feedback">Destination is required.</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="route-duration">Estimated duration</label>
            <input type="text" class="form-control" id="route-duration" placeholder="e.g. 45 mins">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-teal" id="route-save-btn">Save route</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  window.UG_ACTIVE_PAGE = "routes";
  window.UG_PAGE_TITLE = "Routes";
</script>
<script src="js/routes.js"></script>
</body>
</html>
