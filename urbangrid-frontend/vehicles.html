<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicles · UrbanGrid</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
</head>
<body>

<div id="app-shell-mount"></div>

<div id="page-body" class="d-none">

  <div class="alert d-flex align-items-start gap-2" style="background:#fff8ec;border:1px solid #f5e2b8;color:#8a6416;">
    <i class="bi bi-info-circle-fill mt-1"></i>
    <div class="small">The backend only exposes <span class="mono">list</span> and <span class="mono">create</span> for vehicles — there's no edit or delete endpoint, so those actions aren't available here.</div>
  </div>

  <div class="panel mb-4">
    <div class="panel-header">
      <h5><i class="bi bi-funnel me-2"></i>Filter by type</h5>
      <button class="btn btn-teal" id="add-vehicle-btn"><i class="bi bi-plus-lg me-1"></i>Add Vehicle</button>
    </div>
    <div class="btn-group" role="group" id="type-filter">
      <button type="button" class="btn btn-outline-navy active" data-type="ALL">All</button>
      <button type="button" class="btn btn-outline-navy" data-type="BUS">Bus</button>
      <button type="button" class="btn btn-outline-navy" data-type="TRAIN">Train</button>
      <button type="button" class="btn btn-outline-navy" data-type="METRO">Metro</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h5><i class="bi bi-bus-front me-2"></i>Fleet</h5></div>
    <div id="vehicles-table-wrap">
      <div class="text-center text-secondary py-5"><div class="spinner-border spinner-border-sm me-2"></div>Loading vehicles…</div>
    </div>
  </div>

</div>

<!-- Add modal -->
<div class="modal fade" id="vehicle-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Vehicle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="vehicle-form" novalidate>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="vehicle-number">Vehicle number</label>
            <input type="text" class="form-control" id="vehicle-number" placeholder="e.g. BUS-1042" required>
            <div class="invalid-feedback">Vehicle number is required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="vehicle-type">Type</label>
            <select class="form-select" id="vehicle-type" required>
              <option value="BUS">Bus</option>
              <option value="TRAIN">Train</option>
              <option value="METRO">Metro</option>
            </select>
          </div>
          <div class="mb-1">
            <label class="form-label" for="vehicle-capacity">Capacity</label>
            <input type="number" min="0" class="form-control" id="vehicle-capacity" placeholder="e.g. 60" required>
            <div class="invalid-feedback">Enter a capacity.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-navy" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-teal" id="vehicle-save-btn">Save vehicle</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  window.UG_ACTIVE_PAGE = "vehicles";
  window.UG_PAGE_TITLE = "Vehicles";
</script>
<script src="js/vehicles.js"></script>
</body>
</html>
